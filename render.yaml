services:
  - type: web
    name: frank2
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: frank2
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: frank2
    plan: free
    postgresMajorVersion: 16
